# Verificações de todo push e pull request: formatação, lint, tipos, testes e build.
# (A publicação no GitHub Pages fica em pages.yml, na fase F2 do plano.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (edição Local)
        run: npm run build
        env:
          VITE_EDITION: local
      - name: Build do site (Cloud em / e Local em /gratis/)
        # Só confere que compila; valores fictícios (as chaves reais entram no deploy da Cloud)
        run: npm run build:site
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci

  database:
    # Sobe o Postgres do Supabase em Docker, aplica as migrações e roda os testes de banco (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Banco local (migrações)
        run: npx supabase db start
      - name: Testes do banco (RLS, planos, sincronização)
        run: npm run db:test
      - name: Tipos do banco em dia com as migrações
        run: |
          npm run db:types
          git diff --exit-code -- src/editions/cloud/database.types.ts || {
            echo "::error::src/editions/cloud/database.types.ts está desatualizado. Rode npm run db:types e commite."
            exit 1
          }
