<!doctype html>
<html lang="pt-BR">
  <body style="margin: 0; padding: 24px; background: #f8fafc; font-family: Helvetica, Arial, sans-serif; color: #0f172a">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="max-width: 420px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px"
          >
            <tr>
              <td style="padding: 28px">
                <p style="margin: 0 0 20px; font-size: 16px; font-weight: bold">Orçafácil</p>
                <p style="margin: 0 0 12px; font-size: 15px">Seu código de acesso é:</p>
                <p
                  style="
                    margin: 0 0 20px;
                    font-family: Menlo, Consolas, monospace;
                    font-size: 32px;
                    font-weight: bold;
                    letter-spacing: 6px;
                  "
                >
                  {{ .Token }}
                </p>
                <p style="margin: 0 0 8px; font-size: 14px; color: #475569">
                  Digite este código na tela de login. Ele vale por 1 hora e só pode ser usado uma vez.
                </p>
                <p style="margin: 0; font-size: 14px; color: #475569">
                  Se você não pediu este código, ignore este e-mail: ninguém entra na sua conta sem ele.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
